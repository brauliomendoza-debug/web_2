<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Usuarios · Farmacia</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<nav id="navbar"></nav>
<main>
  <h1>Usuarios</h1>
  <div id="alert" class="alert"></div>
  <div class="wrap"><table>
    <thead><tr><th>ID</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Acciones</th></tr></thead>
    <tbody id="filas"></tbody>
  </table></div>
</main>
<script src="/js/app.js"></script>
<script>
const u = requireAuth(['administrador']); renderNavbar();
const roles = ['administrador', 'moderador', 'usuario'];
async function cargar() {
  try {
    const users = await api('/usuarios');
    document.getElementById('filas').innerHTML = users.map((x) => {
      const yo = x.id === u.id;
      return `<tr><td>${x.id}</td><td>${esc(x.nombre)}</td><td>${esc(x.email)}</td>
      <td><select data-rol="${x.id}" ${yo ? 'disabled' : ''}>${roles.map((r) => `<option ${r === x.rol ? 'selected' : ''}>${r}</option>`).join('')}</select></td>
      <td>${yo ? '(tú)' : `<button class="btn sm del" data-del="${x.id}">Eliminar</button>`}</td></tr>`;
    }).join('');
  } catch (e) { showAlert(e.message); }
}
document.getElementById('filas').addEventListener('change', async (e) => {
  if (!e.target.dataset.rol) return;
  try { await api(`/usuarios/${e.target.dataset.rol}/rol`, { method: 'PUT', body: { rol: e.target.value } }); showAlert('Rol actualizado', 'ok'); }
  catch (err) { showAlert(err.message); cargar(); }
});
document.getElementById('filas').addEventListener('click', async (e) => {
  const id = e.target.dataset.del;
  if (id && confirm('¿Eliminar este usuario?')) {
    try { await api('/usuarios/' + id, { method: 'DELETE' }); showAlert('Usuario eliminado', 'ok'); cargar(); }
    catch (err) { showAlert(err.message); }
  }
});
cargar();
</script>
</body></html>
