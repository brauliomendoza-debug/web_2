<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iniciar sesión · Farmacia</title><link rel="stylesheet" href="/css/styles.css"></head>
<body>
<main class="auth card">
  <h1>Iniciar sesión</h1>
  <div id="alert" class="alert"></div>
  <form id="form" novalidate>
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" autocomplete="username">
    <div class="error" data-error="email"></div>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <div class="error" data-error="password"></div>
    <button class="btn" type="submit">Entrar</button>
  </form>
  <p>¿No tienes cuenta? <a href="/register.html">Regístrate</a></p>
</main>
<script src="/js/app.js"></script>
<script>
if (Auth.token()) location.href = '/menu.html';
const form = document.getElementById('form');
form.addEventListener('submit', async (e) => {
  e.preventDefault(); clearErrors(form);
  const email = form.email.value.trim(), password = form.password.value;
  let ok = true;
  if (!EMAIL_RE.test(email)) { fieldError(form, 'email', 'Ingresa un correo válido'); ok = false; }
  if (!password) { fieldError(form, 'password', 'Ingresa tu contraseña'); ok = false; }
  if (!ok) return;
  try {
    const d = await api('/auth/login', { method: 'POST', body: { email, password } });
    Auth.save(d.token, d.user);
    location.href = '/menu.html';
  } catch (err) { showAlert(err.message); }
});
</script>
</body></html>
